spring.cloud.gateway.routes[12].id=auth-docs
spring.cloud.gateway.routes[12].uri=lb://auth-service
spring.cloud.gateway.routes[12].predicates[0]=Path=/v3/api-docs/auth-service
spring.cloud.gateway.routes[12].filters[0]=RewritePath=/v3/api-docs/auth-service,/v3/api-docs

