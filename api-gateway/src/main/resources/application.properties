# ==========================================
# Unified Swagger UI Aggregation Dropdown
# ==========================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=01. Auth Service
springdoc.swagger-ui.urls[0].url=/v3/api-docs/auth-service
springdoc.swagger-ui.urls[1].name=02. Profile Service
springdoc.swagger-ui.urls[1].url=/v3/api-docs/profile-service
