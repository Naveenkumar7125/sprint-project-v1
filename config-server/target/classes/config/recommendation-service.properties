spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/recommendation_db?useSSL=false&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=false

# Configurable recommendation weights and thresholds
recommendation.search-weight=1.0
recommendation.purchase-weight=5.0
recommendation.rating-weight=10.0
recommendation.minimum-search-threshold=1
recommendation.minimum-rating-count=1

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
app.rabbitmq.exchange=eshoppingzone.exchange
