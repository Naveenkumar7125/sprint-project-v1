spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/shipping_db?useSSL=false&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=false

# Third-Party Shipping Aggregator Config (Shiprocket / Shippo)
shipping.provider=shiprocket
shipping.mock-mode=true
shipping.api.base-url=https://apiv2.shiprocket.in/v1/external
shipping.api.key=mock_shiprocket_api_key
shipping.api.secret=mock_shiprocket_api_secret
shipping.webhook.secret=eshoppingzone_webhook_secret_key

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
app.rabbitmq.exchange=eshoppingzone.exchange
