networks:
  eshoppingzone-network:
    driver: bridge

volumes:
  rabbitmq-data:

services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: eshoppingzone-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - eshoppingzone-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  mailhog:
    image: mailhog/mailhog:latest
    container_name: eshoppingzone-mailhog
    restart: always
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - eshoppingzone-network

  eureka-server:
    build:
      context: ./eureka-server
    container_name: eshoppingzone-eureka-server
    restart: always
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: default
    networks:
      - eshoppingzone-network

  config-server:
    build:
      context: ./config-server
    container_name: eshoppingzone-config-server
    restart: always
    ports:
      - "8888:8888"
    environment:
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    networks:
      - eshoppingzone-network

  api-gateway:
    build:
      context: ./api-gateway
    container_name: eshoppingzone-api-gateway
    restart: always
    ports:
      - "8080:8080"
    environment:
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    networks:
      - eshoppingzone-network

  auth-service:
    build:
      context: ./auth-service
    container_name: eshoppingzone-auth-service
    restart: always
    ports:
      - "8086:8086"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888/
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_FLYWAY_VALIDATE_ON_MIGRATE: "false"
      SPRING_RABBITMQ_HOST: rabbitmq
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    depends_on:
      rabbitmq:
        condition: service_healthy
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started
    networks:
      - eshoppingzone-network

  profile-service:
    build:
      context: ./profile-service
    container_name: eshoppingzone-profile-service
    restart: always
    ports:
      - "8081:8081"
    extra_hosts:
