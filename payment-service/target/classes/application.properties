server.port=8087

spring.application.name=payment-service
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888/}
spring.cloud.config.fail-fast=false

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/payment_db?useSSL=false&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
app.rabbitmq.exchange=eshoppingzone.exchange

# Resilience4j Circuit Breaker
resilience4j.circuitbreaker.instances.walletClient.slidingWindowSize=10
resilience4j.circuitbreaker.instances.walletClient.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.walletClient.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.walletClient.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.walletClient.failureRateThreshold=50

management.endpoints.web.exposure.include=health,info,metrics
