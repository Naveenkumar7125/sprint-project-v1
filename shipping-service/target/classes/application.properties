server.port=8093
spring.application.name=shipping-service

# Datasource configuration (Default points to local MySQL port 3306, overrideable by environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/shipping_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false

# Eureka Client
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}

# RabbitMQ
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
app.rabbitmq.exchange=${APP_RABBITMQ_EXCHANGE:eshoppingzone.exchange}

# Third-Party Shipping Aggregator Config (Shiprocket / Shippo)
shipping.provider=${SHIPPING_PROVIDER:shiprocket}
shipping.mock-mode=${SHIPPING_MOCK_MODE:true}
shipping.api.base-url=${SHIPPING_API_BASE_URL:https://apiv2.shiprocket.in/v1/external}
shipping.api.email=${SHIPPING_API_EMAIL:demo@eshoppingzone.com}
shipping.api.password=${SHIPPING_API_PASSWORD:demoSecretPassword}
shipping.api.key=${SHIPPING_API_KEY:mock_shiprocket_api_key}
shipping.api.secret=${SHIPPING_API_SECRET:mock_shiprocket_api_secret}
shipping.webhook.secret=${SHIPPING_WEBHOOK_SECRET:eshoppingzone_webhook_secret_key}

# Actuator & OpenAPI
management.endpoints.web.exposure.include=health,info,metrics
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
